<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Story - Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if not authorized %}
<div class="login-container">
    <h1>Travel Story Database</h1>
    <p class="subtitle">Authorized Access Only</p>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}
    <form action="{{ url_for('database') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">
            Login</button>
    </form>
</div>
{% else %}
<!-- ================= AUTHORIZED DATABASE PAGE ================= -->
<div class="database-container">
    <h1>Travel Story Database</h1>
        <div class="database-actions">
            <a href="#" class="database-btn">Create Tables</a>
            <a href="#" class="database-btn">Show Tables</a>
            <a href="{{ url_for('database_logout') }}" class="logout-btn">Logout</a>
        </div>
    </div>
</div>
{% endif %}
</body>
</html>
